# Instalar una vez por clon: pre-commit install
# Agregar aquí los hooks del lenguaje del proyecto, con versión fija.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-json
        exclude: (^|/)([tj]sconfig[^/]*\.json|\.vscode/.*\.json)$  # admiten comentarios
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^docs/  # Regla 2: no se reescriben
      - id: trailing-whitespace
        exclude: ^docs/
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks  # solo revisa lo preparado para el commit, también con --all-files
      - id: gitleaks
        alias: gitleaks-historial
        name: buscar secretos en el historial
        entry: gitleaks git --redact --verbose
        always_run: true  # sin esto se salta cuando no hay nada preparado
        stages: [manual]

  # Misma versión que uv.lock (ruff==0.17.6); solo el código Python del backend
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        files: ^(src|tests|migrations|scripts)/
      - id: ruff-format
        files: ^(src|tests|migrations|scripts)/

  - repo: local
    hooks:
      - id: correo-noreply
        name: el correo de git debe ser el noreply de GitHub
        # Solo local: en CI no hay identidad de git que revisar (D-10)
        entry: bash -c 'git config user.email | grep -q "@users\.noreply\.github\.com$" || { echo "user.email debe terminar en @users.noreply.github.com"; exit 1; }'
        language: system
        always_run: true
        pass_filenames: false
      - id: validar-kg
        name: validar grafo de conocimiento
        entry: python3 context/validar_kg.py
        language: system
        always_run: true  # mover un documento también puede romper el grafo
        pass_filenames: false
