<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nukyro · Flujo de datos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101018; --bg2:#161622; --card:#1c1c2b; --card2:#23233a; --line:#2e2e46;
  --text:#F2F1FF; --muted:#A3A2B8; --faint:#6c6b84;
  --azul:#4737FF; --azul-osc:#3529BF; --lav:#ACA5FF; --palido:#D1CDFF; --naranja:#F75C03; --piedra:#8a8a99;
  --ins:#3DD68C; --upd:#F5B83D; --del:#FF5C6C; --sel:#7C8CFF; --chk:#D1CDFF;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --sans:'Inter',system-ui,sans-serif; --disp:'Space Grotesk','Inter',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#101018,#171436)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:500;font-size:20px;letter-spacing:.2px}
.brand small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--card2);border-color:#45457a}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--azul);border-color:var(--azul)}
.btn.primary:hover{background:#5848ff}
.btn[aria-pressed="true"]{background:var(--azul-osc);border-color:var(--lav)}
.btn kbd{font-family:var(--mono);font-size:11px;color:var(--muted)}
main{display:grid;grid-template-columns:1fr 400px;min-height:0}
.stage{position:relative;min-height:0;min-width:0;padding:10px}
.stage svg{width:100%;height:100%;display:block}
aside{border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0;position:relative}
.panel{padding:22px 22px 12px;overflow:auto;flex:1;min-height:0}
.chapter{font-family:var(--mono);font-size:12px;color:var(--lav);letter-spacing:.5px;text-transform:uppercase}
.panel h1{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.15;margin:6px 0 12px}
.panel p{margin:0 0 10px;color:#d9d8ec}
.panel p code,.panel li code{font-family:var(--mono);font-size:12.5px;background:#2a2a44;padding:1px 5px;border-radius:5px;color:var(--palido)}
.panel ul{margin:0 0 10px;padding-left:18px;color:#d9d8ec}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid #3d3d66;color:var(--palido);background:#20203a}
.console-h{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 6px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.console{font-family:var(--mono);font-size:12px;padding:0 22px 14px;height:210px;overflow:auto;flex:none}
.log{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:4px 0;border-bottom:1px dashed #2a2a40;animation:in .3s ease-out both}
.log b{font-weight:600}
.log span{color:#cfcfe6;word-break:break-word}
.log span i{font-style:normal;color:var(--muted)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.op-INSERT{color:var(--ins)} .op-UPDATE{color:var(--upd)} .op-DELETE{color:var(--del)} .op-SELECT{color:var(--sel)} .op-CHECK{color:var(--chk)} .op-KEEP{color:var(--lav)} .op-CALL{color:var(--lav)}
footer{display:flex;align-items:center;gap:14px;padding:10px 20px;border-top:1px solid var(--line);background:var(--bg2)}
.timeline{display:flex;gap:4px;flex:1;align-items:center;overflow-x:auto;padding:6px 2px}
.dot{flex:1;min-width:16px;height:8px;border-radius:4px;background:#2a2a44;border:0;cursor:pointer;padding:0;position:relative;transition:background .2s}
.dot:hover{background:#45457a}
.dot.done{background:#4a43a8}
.dot.cur{background:var(--naranja)}
.dot:focus-visible,.btn:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
.counter{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:62px;text-align:center}
/* SVG */
.zone rect{fill:#151522;stroke:#26263a;stroke-width:1}
.zone text{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.3px}
.zone .zc{font-family:var(--mono);font-weight:400;font-size:11px;fill:var(--faint)}
.tbl{cursor:pointer;transition:opacity .4s;transform-box:fill-box;transform-origin:center}
.tbl rect.box{fill:var(--card);stroke:#34344f;stroke-width:1;transition:stroke .3s,fill .3s}
.tbl:hover rect.box{stroke:var(--lav)}
.tbl text{font-family:var(--mono);font-size:12.5px;fill:var(--text);pointer-events:none}
.tbl.dim{opacity:.28}
.tbl.hot rect.box{fill:#24244a;stroke-width:2}
.tbl.focus rect.box{stroke:#fff;stroke-width:2}
.badge{font-family:var(--mono);font-size:10px;font-weight:600}
.actor rect{fill:#1a1830;stroke:#4f4a8f;stroke-dasharray:4 3}
.actor text{font-family:var(--disp);font-size:13px;fill:var(--palido);font-weight:500;pointer-events:none}
.actor .sub{font-family:var(--mono);font-size:10.5px;fill:var(--faint);font-weight:400}
.actor.dim{opacity:.3}
.actor.hot rect{stroke:var(--lav);stroke-dasharray:none;fill:#221f45}
.edge{fill:none;stroke:#3b3b5c;stroke-width:1.2;opacity:.55;transition:opacity .4s}
.edges.dim .edge{opacity:.1}
.edge.lit{stroke:var(--lav);opacity:.9;stroke-width:1.6}
.flow{fill:none;stroke-width:2;stroke-linecap:round;opacity:.85}
.flow.old{opacity:.35}
.legend text{font-family:var(--mono);font-size:11.5px;fill:var(--muted)}
.legend .lt{font-family:var(--disp);font-size:13px;fill:var(--palido);font-weight:500}
/* drawer */
.drawer{position:absolute;inset:0;background:var(--bg2);transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:5}
.drawer.open{transform:none}
.drawer .dh{padding:20px 22px 10px;border-bottom:1px solid var(--line)}
.drawer h2{font-family:var(--mono);font-size:18px;margin:4px 0 6px;font-weight:600}
.drawer .dn{color:var(--muted);font-size:13.5px;white-space:pre-line}
.drawer .cols{overflow:auto;padding:8px 22px 20px;flex:1}
.col{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid #26263a;font-family:var(--mono);font-size:12.5px;align-items:baseline}
.col .k{font-size:10px;font-weight:600;min-width:22px}
.col .k.pk{color:var(--upd)} .col .k.fk{color:var(--sel)}
.col .ty{color:var(--muted);font-size:11.5px}
.col .cn{grid-column:2/4;color:var(--faint);font-family:var(--sans);font-size:12px;margin-top:-4px}
.col .ref{color:var(--sel);font-size:11px}
.close{position:absolute;top:14px;right:14px}
.hint{position:absolute;left:20px;bottom:14px;font-size:12px;color:var(--faint);pointer-events:none}
@media (max-width:1000px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  main{grid-template-columns:1fr}
  .stage{height:62vw;min-height:300px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .drawer{position:fixed;top:auto;height:75vh;bottom:0;border-top:1px solid var(--line);transform:translateY(100%)}
  .hint{display:none}
  header{flex-wrap:wrap;padding:10px 16px}
  footer{padding:10px 16px;flex-wrap:wrap}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="app">
  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <defs><linearGradient id="gk" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3529BF"/><stop offset=".55" stop-color="#4737FF"/><stop offset="1" stop-color="#ACA5FF"/></linearGradient></defs>
        <circle cx="14" cy="17" r="11" fill="url(#gk)"/>
        <path d="M20 8 q3 -4 6 -3" stroke="#D1CDFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <circle cx="26.3" cy="4.6" r="2.4" fill="#F75C03"/>
        <path d="M9.5 17 q1.5 -2 3 0 M15.5 17 q1.5 -2 3 0" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/>

      <button class="btn" id="bAuto" aria-pressed="false" title="Avanzar solo (A)">▶ Auto <kbd>A</kbd></button>
      <button class="btn" id="bReplay" title="Repetir paso (R)">⟲ <kbd>R</kbd></button>
      <button class="btn" id="bFull" title="Pantalla completa (F)">⛶ <kbd>F</kbd></button>
    </div>
  </header>
  <main>
    <div class="stage">
      <svg id="svg" viewBox="0 0 1600 840" role="img" aria-label="Diagrama de las 35 tablas de Nukyro y el flujo de datos del paso actual">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g id="gZones"></g><g id="gEdges" class="edges"></g><g id="gFlows"></g><g id="gNodes"></g><g id="gBadges"></g><g id="gParts"></g>
      </svg>
      <div class="hint">Clic en una tabla para ver sus columnas · ← → para avanzar</div>
    </div>
    <aside>
      <div class="panel" id="panel" aria-live="polite"></div>
      <div class="console-h"><span>Consola SQL del paso</span><span id="opCount"></span></div>
      <div class="console" id="console"></div>
      <div class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="dTitle">
        <button class="btn close" id="dClose" aria-label="Cerrar">✕ <kbd>Esc</kbd></button>
        <div class="dh"><div class="chapter" id="dDomain"></div><h2 id="dTitle"></h2><div class="dn" id="dNote"></div></div>
        <div class="cols" id="dCols"></div>
      </div>
    </aside>
  </main>
  <footer>
    <button class="btn" id="bPrev" aria-label="Paso anterior">◀</button>
    <div class="timeline" id="timeline" role="tablist" aria-label="Pasos"></div>
    <span class="counter" id="counter"></span>
    <button class="btn primary" id="bNext" aria-label="Paso siguiente">Siguiente ▶</button>
  </footer>
</div>

{ch:'Introducción', title:'El mapa: 35 tablas en 5 dominios', all:true,
 html:`<p>La base de datos de Nukyro vive en el esquema <code>nukyro</code> de PostgreSQL 16. Sus 35 tablas se agrupan en cinco dominios:</p>
 <ul><li><b>Contenido versionado</b> (15) y <b>administración</b> (2): lo que escribe el equipo.</li>

{ch:'1 · Contenido', title:'Las evaluaciones del escenario',

/* ---------- Utilidades ---------- */
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function rectOf(name){
  if(ACTORS[name]){const a=ACTORS[name];return {x:a.x,y:a.y,w:a.w,h:a.h,zone:null};}
  const p=POS[name];return {x:p[0],y:p[1],w:BW,h:BH,zone:p[2]};
}
function pathBetween(a,b){
  const A=rectOf(a),B=rectOf(b);
  const acx=A.x+A.w/2, acy=A.y+A.h/2, bcx=B.x+B.w/2, bcy=B.y+B.h/2;
  const gapX = B.x > A.x+A.w ? B.x-(A.x+A.w) : (A.x > B.x+B.w ? A.x-(B.x+B.w) : -1);
  if(gapX>16){
    const r = bcx>acx;
    const x1=r?A.x+A.w:A.x, x2=r?B.x:B.x+B.w, y1=acy, y2=bcy;
    const c=Math.max(36,Math.abs(x2-x1)*.45)*(r?1:-1);
    return `M${x1},${y1} C${x1+c},${y1} ${x2-c},${y2} ${x2},${y2}`;
  }
  const dy=bcy-acy;
  if(Math.abs(dy)<=80 && Math.abs(acx-bcx)<60){
    const down=dy>0;const y1=down?A.y+A.h:A.y, y2=down?B.y:B.y+B.h;
    return `M${acx},${y1} C${acx},${(y1+y2)/2} ${bcx},${(y1+y2)/2} ${bcx},${y2}`;
  }
  // misma columna, no adyacentes: rodear por el lado exterior de la zona
  const z=A.zone?DOMAINS[A.zone]:null;
  const right = z ? (acx > z.x+z.w/2) : false;
  const x1=right?A.x+A.w:A.x, x2=right?B.x+B.w:B.x;
  const bulge=(28+Math.abs(dy)*.12)*(right?1:-1);
  return `M${x1},${acy} C${x1+bulge},${acy} ${x2+bulge},${bcy} ${x2},${bcy}`;
}

}

/* ---------- Estado y reproducción ---------- */
let cur=0, token=0, speed=1, auto=false, autoTimer=null, touched={};
const timers=new Set();
const wait=ms=>new Promise(res=>{const id=setTimeout(()=>{timers.delete(id);res();},ms/speed);timers.add(id);});
function clearTimers(){for(const id of timers)clearTimeout(id);timers.clear();}

function badge(t,ops){
  const old=gB.querySelector(`[data-t="${t}"]`);if(old)old.remove();
  const r=rectOf(t);const label=[...ops].join(' · ');const w=label.length*6.3+12;
  const g=el('g',{'data-t':t},gB);
  const c=OPC[[...ops].slice(-1)[0]];
  el('rect',{x:r.x+r.w-w+6,y:r.y-9,width:w,height:16,rx:8,fill:c},g);
  const x=el('text',{x:r.x+r.w-w+12,y:r.y+2.5,class:'badge',fill:'#101018'},g);x.textContent=label;
  if(!reduce) g.animate([{transform:'translateY(4px)',opacity:0},{transform:'none',opacity:1}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});
}
function mark(t,op){
  if(ACTORS[t]){actorEls[t].classList.remove('dim');actorEls[t].classList.add('hot');return;}
  touched[t]=touched[t]||new Set();touched[t].delete(op);touched[t].add(op);
  const g=nodeEls[t];g.classList.remove('dim');g.classList.add('hot');
  g.querySelector('.box').style.stroke=OPC[op];
  badge(t,touched[t]);
  if(!reduce) g.animate([{transform:'scale(1)'},{transform:'scale(1.07)'},{transform:'scale(1)'}],{duration:450,easing:'ease-out'});
}
function logLine(op,to,label){
  const c=$('#console');const d=document.createElement('div');d.className='log';
  d.innerHTML=`<b class="op-${op}">${op}</b><span>${ACTORS[to]?ACTORS[to].label:to}${label?` <i>· ${label}</i>`:''}</span>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function travel(path,color,dur,myToken){
  return new Promise(res=>{
    if(reduce){res();return;}
    const len=path.getTotalLength();const dot=el('circle',{r:6,fill:color,filter:'url(#glow)'},gP);
    const t0=performance.now();
    (function f(now){
      if(myToken!==token){dot.remove();res();return;}
      let k=Math.min(1,(now-t0)/(dur/speed));const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const p=path.getPointAtLength(e*len);dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);
      if(k<1)requestAnimationFrame(f);else{dot.animate([{opacity:1,r:6},{opacity:0,r:14}],{duration:300}).onfinish=()=>dot.remove();res();}
    })(t0);
  });
}
async function runOp(op,myToken){
  const [from,to,kind,label]=op;
  logLine(kind,to,label);
  if(from){
    if(ACTORS[from])mark(from,kind);
    const p=el('path',{d:pathBetween(from,to),class:'flow',stroke:OPC[kind]},gF);
    if(!reduce){const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
      p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:520/speed,fill:'forwards',easing:'ease-out'});}
    else p.style.strokeDasharray='none';
    await travel(p,OPC[kind],780,myToken);
    if(myToken!==token)return;
    p.classList.add('old');
  }
  mark(to,kind);
}
async function playStep(i){
  const myToken=++token;clearTimers();clearTimeout(autoTimer);
  const s=STEPS[i];touched={};
  gF.innerHTML='';gB.innerHTML='';gP.innerHTML='';$('#console').innerHTML='';
  // estado visual inicial
  const all=!!s.all;
  for(const t in nodeEls){const g=nodeEls[t];g.classList.remove('hot','focus');g.querySelector('.box').style.stroke='';g.classList.toggle('dim',!all && !(s.keep||[]).includes(t));}
  for(const k in actorEls){actorEls[k].classList.remove('hot');actorEls[k].classList.toggle('dim',!all && !(s.actors||[]).includes(k));}
  gE.classList.toggle('dim',!all);
  edgeEls.forEach(e=>e.classList.remove('lit'));
  if(all && !reduce){edgeEls.forEach((e,j)=>{const L=e.getTotalLength();e.animate([{strokeDasharray:L,strokeDashoffset:L},{strokeDasharray:L,strokeDashoffset:0}],{duration:900,delay:j*18,fill:'backwards',easing:'ease-out'});});
    Object.values(nodeEls).forEach((g,j)=>g.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:400,delay:j*20,fill:'backwards'}));}
  if(s.keep){s.keep.forEach(t=>mark(t,'KEEP'));logLine('KEEP',`${s.keep.length} tablas`,'sin datos personales');}
  renderPanel(i);
  $('#opCount').textContent=s.ops.length?`${s.ops.length} operaciones`:'';
  await wait(reduce?0:350);
  // ejecutar operaciones (las marcadas en paralelo arrancan junto con la anterior)
  let k=0;
  while(k<s.ops.length){
    if(myToken!==token)return;
    const group=[s.ops[k]];k++;
    while(k<s.ops.length && s.ops[k][4]){group.push(s.ops[k]);k++;}
    await Promise.all(group.map(o=>runOp(o,myToken)));
    await wait(reduce?0:(s.hero?260:180));
  }
  if(myToken!==token)return;
  if(auto && cur<STEPS.length-1) autoTimer=setTimeout(()=>go(cur+1),4200/speed);
}
function renderPanel(i){
  const s=STEPS[i];
  $('#panel').innerHTML=`<div class="chapter">${s.ch}</div><h1>${s.title}</h1>${s.html}<div class="chips">${(s.refs||[]).map(r=>`<span class="chip">${r}</span>`).join('')}</div>`;
  $('#panel').scrollTop=0;
  $('#counter').textContent=`${i+1} / ${STEPS.length}`;
  document.querySelectorAll('.dot').forEach((d,j)=>{d.classList.toggle('cur',j===i);d.classList.toggle('done',j<i);d.setAttribute('aria-selected',j===i);});
  $('#bPrev').disabled=i===0;$('#bNext').disabled=i===STEPS.length-1;
}
function go(i){if(i<0||i>=STEPS.length)return;cur=i;closeDrawer();playStep(i);}

  const T=DATA.tables[t];focused=t;
  $('#dDomain').textContent=DLABEL[POS[t][2]];$('#dTitle').textContent=t;
  $('#dNote').textContent=T.note||'';
  $('#dCols').innerHTML=T.cols.map(c=>`<div class="col"><span class="k ${c.pk?'pk':c.fk?'fk':''}">${c.pk?'PK':c.fk?'FK':''}</span><span>${c.n}${c.nn?'':' <span class="ty">?</span>'}${c.fk?` <span class="ref">→ ${c.fk}</span>`:''}</span><span class="ty">${c.t}</span>${c.note?`<span class="cn">${c.note}</span>`:''}</div>`).join('');
  $('#drawer').classList.add('open');
  for(const k in nodeEls)nodeEls[k].classList.toggle('focus',k===t);
  edgeEls.forEach(e=>e.classList.toggle('lit',e.dataset.a===t||e.dataset.b===t));
  gE.classList.add('dim');
  $('#dClose').focus({preventScroll:true});
}
function closeDrawer(){
  if(!focused)return;focused=null;$('#drawer').classList.remove('open');
  for(const k in nodeEls)nodeEls[k].classList.remove('focus');
  edgeEls.forEach(e=>e.classList.remove('lit'));
  gE.classList.toggle('dim',!STEPS[cur].all);
}

/* ---------- Controles ---------- */
const tl=$('#timeline');
STEPS.forEach((s,j)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('role','tab');b.title=`${j+1}. ${s.title}`;b.setAttribute('aria-label',`Paso ${j+1}: ${s.title}`);b.onclick=()=>go(j);tl.appendChild(b);});
$('#bNext').onclick=()=>go(cur+1);$('#bPrev').onclick=()=>go(cur-1);
$('#bReplay').onclick=()=>playStep(cur);
$('#dClose').onclick=closeDrawer;
const speeds=[1,1.5,2,.6];
$('#bSpeed').onclick=e=>{speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];e.currentTarget.textContent=speed+'×';};
function toggleAuto(){auto=!auto;$('#bAuto').setAttribute('aria-pressed',auto);$('#bAuto').firstChild.textContent=auto?'❚❚ Auto ':'▶ Auto ';if(auto&&cur<STEPS.length-1)autoTimer=setTimeout(()=>go(cur+1),1500);else clearTimeout(autoTimer);}
$('#bAuto').onclick=toggleAuto;
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
$('#bFull').onclick=full;
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('.tbl')&&(e.key===' '||e.key==='Enter'))return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  else if(e.key==='Escape')closeDrawer();
  else if(e.key==='r'||e.key==='R')playStep(cur);
  else if(e.key==='f'||e.key==='F')full();
  else if(e.key==='a'||e.key==='A')toggleAuto();
  else if(e.key==='Home')go(0);else if(e.key==='End')go(STEPS.length-1);
});
// arranque (permite #5 en la URL para abrir un paso)
const h=parseInt(location.hash.slice(1));go(Number.isFinite(h)&&h>=1&&h<=STEPS.length?h-1:0);
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n>=1&&n<=STEPS.length)go(n-1);});
</script>
</body>
