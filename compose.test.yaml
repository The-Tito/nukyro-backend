# Solo para las pruebas de integración en el equipo anfitrión: publica la base en un puerto
# aleatorio de 127.0.0.1. Uso: docker compose -f compose.yaml -f compose.test.yaml ...
services:
  db:
    ports:
      - "127.0.0.1::5432"
  # El emisor simulado, para que las pruebas del anfitrión pidan tokens (D-34)
  issuer:
    ports:
      - "127.0.0.1::8080"
