name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Acciones fijadas por SHA de commit (v7.0.1 y v10.4.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.11.19"
          enable-cache: false
      # Un comando: KG, ruff, migración, pruebas SQL, unit, integration y caja negra por HTTPS.
      # El hook del correo noreply (.pre-commit-config.yaml) es solo local y no corre aquí.
      - run: scripts/verify
